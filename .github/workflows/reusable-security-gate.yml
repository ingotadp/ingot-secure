name: Reusable Spoke Security Gate

on:
  workflow_call:
    inputs:
      run-iac-scan:
        description: "Run Trivy IaC misconfiguration scan"
        type: boolean
        default: true
      tfplan-json-path:
        description: "Optional path to terraform show -json plan file for OPA evaluation"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  security-gate:
    name: IngotADP Pre-Merge Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Checkout ingot-secure policies
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ingotadp/ingot-secure
          path: .ingot-secure

      - name: Install Conftest, Trivy, and Gitleaks
        run: |
          curl -fsSL https://github.com/open-policy-agent/conftest/releases/download/v0.71.1/conftest_0.71.1_Linux_x86_64.tar.gz | tar -xz -C /usr/local/bin conftest
          curl -fsSL https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz | tar -xz -C /usr/local/bin trivy
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks

      - name: Secret detection (Gitleaks)
        run: gitleaks detect --source . --config .ingot-secure/.gitleaks.toml --verbose

      - name: Workflow supply-chain policy check (Conftest)
        run: |
          if compgen -G ".github/workflows/*.yml" > /dev/null; then
            conftest test --policy .ingot-secure/policies/github-actions --namespace ingot.github_actions.security .github/workflows/*.yml
          fi

      - name: Terraform plan policy check (Conftest)
        if: inputs.tfplan-json-path != ''
        run: conftest test --policy .ingot-secure/policies/terraform --namespace ingot.terraform.security "${{ inputs.tfplan-json-path }}"

      - name: IaC misconfiguration scan (Trivy)
        if: inputs.run-iac-scan
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 .
