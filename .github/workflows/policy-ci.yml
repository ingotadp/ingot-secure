name: Policy Engine CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-policies:
    name: Format, Test, and Self-Lint Policies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install OPA, Conftest, and Gitleaks
        run: |
          curl -fsSL https://openpolicyagent.org/downloads/v1.22.4/opa_linux_amd64_static -o /usr/local/bin/opa
          chmod +x /usr/local/bin/opa

          curl -fsSL https://github.com/open-policy-agent/conftest/releases/download/v0.71.1/conftest_0.71.1_Linux_x86_64.tar.gz | tar -xz -C /usr/local/bin conftest
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks

      - name: Check Rego formatting
        run: opa fmt --fail policies/

      - name: Run Rego unit tests
        run: opa test policies/ -v

      - name: Self-validate GitHub Actions workflows with Conftest
        run: conftest test --policy policies/github-actions --namespace ingot.github_actions.security .github/workflows/*.yml

      - name: Scan repository for hardcoded secrets
        run: gitleaks detect --source . --config .gitleaks.toml --verbose
